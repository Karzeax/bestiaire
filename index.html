<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beastgard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" id="theme-extra" href="">
</head>
<body>

<div class="theme-switcher" id="theme-switcher" aria-label="Changer de thème">
  <button class="theme-option" id="theme-dawn" type="button" aria-pressed="false">
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
    <span>Dawn</span>
  </button>
  <div class="theme-switcher-divider"></div>
  <button class="theme-option active" id="theme-dusk" type="button" aria-pressed="true">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
    <span>Dusk</span>
  </button>
</div>

<header>
  <div class="beastgard-logo" aria-label="Beastgard">
    <span class="logo-icon-wrap">
      <i class="fa-solid fa-diamond" aria-hidden="true"></i>
      <i class="fa-solid fa-diamond logo-inner-frame" aria-hidden="true"></i>
      <span class="logo-icon-letter">B</span>
    </span>
    <span class="logo-letters">E A S T G A R</span>
    <span class="logo-icon-wrap">
      <i class="fa-solid fa-circle" aria-hidden="true"></i>
      <i class="fa-solid fa-circle logo-inner-frame" aria-hidden="true"></i>
      <span class="logo-icon-letter">D</span>
    </span>
  </div>
  <p>Répertoire des créatures de Kigard</p>
</header>

<div class="search-wrap">
  <div class="search-modes" role="tablist" aria-label="Mode de recherche">
    <button type="button" class="search-mode active" data-mode="name" role="tab" aria-selected="true">Monstres</button>
    <button type="button" class="search-mode" data-mode="competences" role="tab" aria-selected="false">Compétences</button>
    <button type="button" class="search-mode" data-mode="items" role="tab" aria-selected="false">Items</button>
    <button type="button" class="search-mode" data-mode="drops" role="tab" aria-selected="false">Drops</button>
  </div>
  <input type="text" id="search" placeholder="Rechercher un monstre…" autocomplete="off">
  <div class="zone-filters" role="group" aria-label="Filtrer par zone">
    <button type="button" class="zone-filter active" data-region="Nandor" aria-pressed="true">Nandor</button>
    <button type="button" class="zone-filter active" data-region="Kigard" aria-pressed="true">Kigard</button>
  </div>
</div>

<p class="count" id="count"></p>

<div id="results"></div>
<div class="empty" id="empty">
  <span class="empty-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
  Aucun monstre trouvé.
</div>

<!-- Bouton retour en haut -->
<button class="back-to-top" id="back-to-top" aria-label="Retour en haut">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>

<!-- Modal principale (détails monstre) -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Modal d'aide (fiche Kigard rendue nativement en thème sombre) -->
<div class="help-overlay" id="help-modal-overlay">
  <div class="help-modal">
    <button class="help-close" id="help-close-btn" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
    <div class="help-content" id="help-content"></div>
  </div>
</div>

<!-- Données puis logique -->
<script src="monsters.js"></script>
<script src="competences.js"></script>
<script src="dons.js"></script>
<script src="items.js"></script>
<script src="main.js"></script>

<!-- Bascule de thème jour / nuit (défaut : nuit) -->
<script>
(function () {
  const STORAGE_KEY = 'beastgard-theme';
  const themeExtra  = document.getElementById('theme-extra');
  const btnDusk     = document.getElementById('theme-dusk');
  const btnDawn     = document.getElementById('theme-dawn');

  // localStorage peut lever (navigation privée / quota) → on l'enrobe.
  function saveTheme(t) { try { localStorage.setItem(STORAGE_KEY, t); } catch (_) {} }
  function readTheme()  { try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; } }

  function applyTheme(theme) {
    const isDawn = theme === 'dawn';
    themeExtra.href = isDawn ? 'parchemin.css' : '';   // jour = parchemin, nuit = aucun override
    btnDawn.classList.toggle('active',  isDawn);
    btnDusk.classList.toggle('active', !isDawn);
    btnDawn.setAttribute('aria-pressed', String( isDawn));
    btnDusk.setAttribute('aria-pressed', String(!isDawn));
    saveTheme(theme);
  }

  btnDusk.addEventListener('click', () => applyTheme('dusk'));
  btnDawn.addEventListener('click', () => applyTheme('dawn'));

  applyTheme(readTheme() || 'dusk');  // défaut : nuit (identité actuelle du bestiaire)
})();
</script>

</body>
</html>
